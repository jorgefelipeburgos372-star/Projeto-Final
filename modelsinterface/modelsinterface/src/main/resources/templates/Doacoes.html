
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doações</title>

    <link rel="stylesheet" th:href="@{/Css/estilo.css}">
    <link rel="stylesheet" th:href="@{/Css/Contas-Centro.css}">
</head>

<body>

<header class="cabecalho">
    <h1>Sistema de Cadastros</h1>
    <p>Cadastro e consulta de doações</p>
</header>

<main class="container">

    <!-- CADASTRO DE DOAÇÕES -->
    <section class="cartao secao-contas">

        <h2>Cadastro de Doações</h2>

        <form id="formDoacao">

            <div class="grade-formulario">

                <div class="campo">
                    <label>Nome do Doador:</label>
                    <input type="text" id="nomeDoador"
                           placeholder="Digite o nome do doador" required>
                </div>

                <div class="campo">
                    <label>Tipo de Doação:</label>
                    <select id="tipo" required>
                        <option value="">Selecione o tipo</option>
                        <option value="Dinheiro">Dinheiro</option>
                        <option value="Alimentos">Alimentos</option>
                        <option value="Roupas">Roupas</option>
                        <option value="Móveis">Móveis</option>
                        <option value="Materiais">Materiais</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>

                <div class="campo campo-completo">
                    <label>Descrição da Doação:</label>
                    <input type="text" id="descricao"
                           placeholder="Descreva o que foi doado" required>
                </div>

                <div class="campo">
                    <label>Valor (R$):</label>
                    <input type="number" id="valor"
                           step="0.01" min="0"
                           placeholder="0,00">
                </div>

                <div class="campo">
                    <label>Data da Doação:</label>
                    <input type="date" id="dataDoacao" required>
                </div>

                <div class="campo campo-completo">
                    <label>Observações:</label>
                    <textarea id="observacoes" rows="3"
                              placeholder="Digite alguma observação"></textarea>
                </div>

            </div>

            <div class="botoes-formulario">

                <button type="reset" class="botao botao-secundario">
                    Limpar
                </button>

                <button type="submit" class="botao botao-principal">
                    Cadastrar Doação
                </button>

            </div>

        </form>

    </section>


    <!-- CONSULTA DE DOAÇÕES -->
    <section class="cartao secao-contas">

        <h2>Doações Cadastradas</h2>

        <div class="filtros-contas">

            <input type="text" id="pesquisa"
                   placeholder="Pesquisar doador ou doação">

            <select id="filtroTipo">
                <option value="">Todos os tipos</option>
                <option value="Dinheiro">Dinheiro</option>
                <option value="Alimentos">Alimentos</option>
                <option value="Roupas">Roupas</option>
                <option value="Móveis">Móveis</option>
                <option value="Materiais">Materiais</option>
                <option value="Outros">Outros</option>
            </select>

        </div>

        <div class="tabela-responsiva">

            <table>

                <thead>
                <tr>
                    <th>Doador</th>
                    <th>Tipo</th>
                    <th>Descrição</th>
                    <th>Valor</th>
                    <th>Data</th>
                    <th>Ações</th>
                </tr>
                </thead>

                <tbody id="listaDoacoes">
                <tr>
                    <td colspan="6">Carregando doações...</td>
                </tr>
                </tbody>

            </table>

        </div>

    </section>

    <a href="/" class="botao-voltar">Voltar ao Menu Principal</a>

</main>

<footer class="rodape">
    Sistema de Cadastro e Consulta de Doações
</footer>


<script>

    // ENDEREÇO DA API
    const API = 'http://localhost:8080/doacoes';

    const formDoacao = document.getElementById('formDoacao');
    const listaDoacoes = document.getElementById('listaDoacoes');

    let doacoes = [];


    // FORMATA VALOR EM REAIS
    function formatarValor(valor) {

        if (valor === null || valor === undefined || valor === '') {
            return '-';
        }

        return Number(valor).toLocaleString('pt-BR', {
            style: 'currency',
            currency: 'BRL'
        });
    }


    // FORMATA DATA
    function formatarData(data) {

        if (!data) {
            return '-';
        }

        const partes = data.split('-');

        if (partes.length !== 3) {
            return data;
        }

        return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }


    // CARREGAR DOAÇÕES
    async function carregarDoacoes() {

        try {

            const resposta = await fetch(API);

            if (!resposta.ok) {
                throw new Error('Erro ao buscar doações.');
            }

            doacoes = await resposta.json();

            mostrarDoacoes();

        } catch (erro) {

            console.error(erro);

            listaDoacoes.innerHTML = `
                <tr>
                    <td colspan="6">
                        Não foi possível carregar as doações.
                    </td>
                </tr>
            `;
        }
    }


    // MOSTRAR DOAÇÕES NA TABELA
    function mostrarDoacoes() {

        const pesquisa = document.getElementById('pesquisa')
            .value.toLowerCase();

        const filtroTipo = document.getElementById('filtroTipo').value;

        const doacoesFiltradas = doacoes.filter(doacao => {

            const nome = (doacao.nomeDoador || '').toLowerCase();
            const descricao = (doacao.descricao || '').toLowerCase();

            const correspondePesquisa =
                nome.includes(pesquisa) ||
                descricao.includes(pesquisa);

            const correspondeTipo =
                filtroTipo === '' || doacao.tipo === filtroTipo;

            return correspondePesquisa && correspondeTipo;
        });

        listaDoacoes.innerHTML = '';

        if (doacoesFiltradas.length === 0) {

            listaDoacoes.innerHTML = `
                <tr>
                    <td colspan="6">Nenhuma doação encontrada.</td>
                </tr>
            `;

            return;
        }

        doacoesFiltradas.forEach(doacao => {

            const linha = document.createElement('tr');

            const botaoExcluir = document.createElement('button');

            botaoExcluir.textContent = 'Excluir';
            botaoExcluir.className = 'botao botao-excluir';

            botaoExcluir.addEventListener('click', () => {
                excluirDoacao(doacao.id);
            });

            const colunas = [
                doacao.nomeDoador || '',
                doacao.tipo || '',
                doacao.descricao || '',
                formatarValor(doacao.valor),
                formatarData(doacao.dataDoacao)
            ];

            colunas.forEach(texto => {
                const coluna = document.createElement('td');
                coluna.textContent = texto;
                linha.appendChild(coluna);
            });

            const colunaAcoes = document.createElement('td');
            colunaAcoes.appendChild(botaoExcluir);
            linha.appendChild(colunaAcoes);

            listaDoacoes.appendChild(linha);

        });
    }


    // CADASTRAR DOAÇÃO
    formDoacao.addEventListener('submit', async function(event) {

        event.preventDefault();

        const doacao = {

            nomeDoador: document.getElementById('nomeDoador').value,
            tipo: document.getElementById('tipo').value,
            descricao: document.getElementById('descricao').value,
            valor: document.getElementById('valor').value === ''
                ? null
                : Number(document.getElementById('valor').value),
            dataDoacao: document.getElementById('dataDoacao').value,
            observacoes: document.getElementById('observacoes').value

        };

        if (doacao.tipo !== 'Dinheiro') {
            doacao.valor = null;
        }

        try {

            const resposta = await fetch(API, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(doacao)
            });

            if (!resposta.ok) {
                throw new Error('Erro ao cadastrar doação.');
            }

            alert('Doação cadastrada com sucesso!');

            formDoacao.reset();

            carregarDoacoes();

        } catch (erro) {

            console.error(erro);

            alert('Não foi possível cadastrar. Verifique se o back-end está funcionando.');

        }

    });


    // EXCLUIR DOAÇÃO
    async function excluirDoacao(id) {

        const confirmar = confirm(
            'Tem certeza que deseja excluir esta doação?'
        );

        if (!confirmar) {
            return;
        }

        try {

            const resposta = await fetch(`${API}/${id}`, {
                method: 'DELETE'
            });

            if (!resposta.ok) {
                throw new Error('Erro ao excluir doação.');
            }

            alert('Doação excluída com sucesso!');

            carregarDoacoes();

        } catch (erro) {

            console.error(erro);

            alert('Não foi possível excluir a doação.');

        }
    }


    // PESQUISA E FILTRO
    document.getElementById('pesquisa')
        .addEventListener('input', mostrarDoacoes);

    document.getElementById('filtroTipo')
        .addEventListener('change', mostrarDoacoes);


    // INICIAR PÁGINA
    carregarDoacoes();

</script>

</body>
</html>
