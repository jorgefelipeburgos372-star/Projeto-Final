
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Centros</title>

    <link rel="stylesheet" th:href="@{/Css/estilo.css}">

    <style>
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background-color: #17365d;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #17365d;
            color: white;
        }
    </style>
</head>

<body>

<header class="cabecalho">
    <h1>Sistema de Cadastros</h1>
    <p>Cadastro e consulta de centros</p>
</header>

<main class="container">

    <section class="cartao">

        <h2>Cadastro de Centro</h2>

        <form>
            <label>Nome do Centro:</label>
            <input type="text" placeholder="Digite o nome do centro">

            <label>Telefone:</label>
            <input type="text" placeholder="Digite o telefone">

            <label>Endereço:</label>
            <input type="text" placeholder="Digite o endereço">

            <label>Nome do Responsável:</label>
            <input type="text" placeholder="Digite o nome do responsável">

            <label>E-mail do Responsável:</label>
            <input type="email" placeholder="Digite o e-mail">

            <button type="button">Cadastrar</button>
        </form>

        <br>

        <a href="/" class="botao-voltar">Voltar ao Menu Principal</a>

    </section>

</main>

<footer class="rodape">
    Sistema de Cadastro Centros
</footer>

</body>
</html>
